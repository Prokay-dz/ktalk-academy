services:
  - type: web
    name: ktalk-academy-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGIN
        sync: false
    # Free tier does not support persistent disks, so the SQLite database
    # (server/ktalk.db) is wiped on every redeploy/restart. If you need data
    # to survive redeploys, upgrade this service to a paid plan and add:
    # disk:
    #   name: ktalk-data
    #   mountPath: /opt/render/project/src
    #   sizeGB: 1
